name: Bug 报告
description: 报告可复现的错误、数据问题或页面异常
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先使用应用底部或恢复界面的“复制诊断信息”准备版本资料。

        **请勿公开上传未经脱敏的人物文件、完整资料库备份、分享链接 token，或包含真实个人信息的数据。** 如果问题必须使用数据复现，请先制作最小复现并彻底脱敏。
  - type: input
    id: version
    attributes:
      label: COCSheet version
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: input
    id: build_sha
    attributes:
      label: Build SHA
      placeholder: 例如 abcdef1234567890...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      placeholder: 例如 Chrome 151
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 11 / macOS 15 / Android 16
    validations:
      required: true
  - type: input
    id: workflow
    attributes:
      label: 受影响页面或操作流程
      placeholder: 例如 首页 → 导入完整备份
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供可以从干净页面重复执行的最小步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: dropdown
    id: data_operation
    attributes:
      label: 是否涉及导入、导出或本地数据修改？
      options:
        - 否
        - 是：导入
        - 是：导出
        - 是：人物、建卡进度或预设修改
        - 不确定
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息
      description: 可粘贴应用生成的诊断报告；提交前仍请确认其中没有私人内容。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有公开上传未经脱敏的人物文件、完整备份、分享 token 或真实个人信息。
          required: true
