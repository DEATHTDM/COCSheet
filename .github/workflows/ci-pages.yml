name: CI & Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check pull request diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Check pushed diff whitespace
        if: github.event_name == 'push'
        run: git diff --check "${{ github.event.before }}...${{ github.sha }}"

      - name: Check dispatched revision whitespace
        if: github.event_name == 'workflow_dispatch'
        run: git show --check --format= "${{ github.sha }}"

      - name: Run tests
        run: corepack pnpm test

      - name: Validate release compliance boundaries
        run: corepack pnpm validate:release-compliance

      - name: Assert v1.0.0 release candidate version
        env:
          EXPECTED_APP_VERSION: 1.0.0
        run: corepack pnpm validate:release-compliance

      - name: Build application
        env:
          VITE_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: corepack pnpm build

      - name: Verify static build artifact
        env:
          EXPECTED_APP_VERSION: 1.0.0
          EXPECTED_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -f dist/index.html
          if grep -Eq '(src|href)="/assets/' dist/index.html; then
            echo "dist/index.html contains a root-relative asset URL."
            exit 1
          fi
          grep -R -F "$EXPECTED_APP_VERSION" dist/assets >/dev/null
          grep -R -F "$EXPECTED_BUILD_SHA" dist/assets >/dev/null

      - name: Install Playwright Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run production-preview E2E
        env:
          EXPECTED_APP_VERSION: 1.0.0
          VITE_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: corepack pnpm test:e2e

      - name: Validate occupation audit
        run: node scripts/validate-occupation-audit.mjs

      - name: Validate Standard weapon audit
        run: node scripts/validate-standard-weapons.mjs

  build-pages:
    name: Build Pages artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build application
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: corepack pnpm build

      - name: Verify static build artifact
        env:
          EXPECTED_APP_VERSION: 1.0.0
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: |
          test -f dist/index.html
          if grep -Eq '(src|href)="/assets/' dist/index.html; then
            echo "dist/index.html contains a root-relative asset URL."
            exit 1
          fi
          grep -R -F "$EXPECTED_APP_VERSION" dist/assets >/dev/null
          grep -R -F "$EXPECTED_BUILD_SHA" dist/assets >/dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
